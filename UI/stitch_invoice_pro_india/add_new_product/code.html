<body class="bg-surface font-body-md text-on-surface min-h-screen pb-24">
<!-- Top App Bar -->
<header class="sticky top-0 z-40 glass-header flex items-center justify-between px-margin-mobile h-16 w-full transition-colors duration-200">
<div class="flex items-center gap-4">
<button class="p-2 -ml-2 rounded-full hover:bg-surface-container-low active:opacity-80 transition-all">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<h1 class="font-title-lg text-title-lg text-primary">Add New Product</h1>
</div>
<div class="flex items-center">
<button class="p-2 rounded-full hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="more_vert">more_vert</span>
</button>
</div>
</header>
<main class="px-margin-mobile pt-lg space-y-lg">
<!-- Image Upload Section -->
<section class="flex flex-col items-center">
<div class="relative group cursor-pointer">
<div class="w-28 h-28 rounded-xl bg-surface-container-high border-2 border-dashed border-outline-variant flex flex-col items-center justify-center overflow-hidden transition-all hover:border-primary">
<span class="material-symbols-outlined text-on-surface-variant text-4xl mb-1">add_a_photo</span>
<span class="font-label-md text-label-md text-on-surface-variant">Add Image</span>
<!-- Hidden img tag for logic, using placeholder -->
<img class="absolute inset-0 w-full h-full object-cover opacity-0 group-hover:opacity-10" data-alt="A professional studio product photography setup with clean, soft-box lighting against a minimalist light blue background. The scene is empty, awaiting a product, conveying a modern and premium e-commerce business aesthetic suitable for an Indian SME software application." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDHf6EXCEo7TgcJYCWStpvQqF4268YWWkyuJukSpvPoiI3ndWhZG81WfCjkDb0VsJSOQ4fo-Kk-FNXcBEfl77mU9esVi5uFNuXw-0GjbodCylVdpIu36cG8pCgiHockNDdBC96DK3hqIXDxG0IVTGtyFvk3VcL83ScD5daKRismVh2Xl7r1atexvGcTE_7qEVQB2_DUQipHYa_WUC1POHgKZA1Q5VUcB7OJgK0W1QrtgJavNJqF2oVW">
</div>
</div>
<p class="mt-sm font-label-md text-label-md text-outline">Recommended size: 800x800 px</p>
</section>
<!-- Product Basic Info -->
<section class="space-y-md">
<div class="grid grid-cols-1 gap-md">
<!-- Product Name -->
<div class="relative">
<label class="absolute -top-2 left-3 px-1 bg-surface text-label-md font-label-md text-primary z-10">Product Name *</label>
<input class="w-full h-14 px-4 rounded-lg border border-outline focus:border-2 focus:border-primary focus:ring-0 bg-transparent text-body-lg font-body-lg outline-none transition-all placeholder:text-outline-variant" placeholder="e.g. Premium Basmati Rice" type="text">
</div>
<!-- SKU Code -->
<div class="relative">
<label class="absolute -top-2 left-3 px-1 bg-surface text-label-md font-label-md text-outline z-10">SKU / Product Code</label>
<input class="w-full h-14 px-4 rounded-lg border border-outline-variant focus:border-2 focus:border-primary focus:ring-0 bg-transparent text-body-lg font-body-lg outline-none transition-all pr-12" placeholder="e.g. BR-1002-X" type="text">
<button class="absolute right-3 top-1/2 -translate-y-1/2 p-2 rounded-full hover:bg-surface-container-low text-on-surface-variant active:opacity-80 transition-all" aria-label="Scan Barcode">
  <span class="material-symbols-outlined">barcode_scanner</span>
</button></div>
</div>
</section>
<!-- Category Selection -->
<section class="space-y-sm">
<div class="flex justify-between items-center">
<h3 class="font-title-md text-title-md text-on-surface">Category</h3>
<button class="text-primary font-label-lg text-label-lg">+ Add New</button>
</div>
<div class="flex flex-wrap gap-2">
<button class="px-4 py-2 rounded-full border border-primary bg-primary-container text-on-primary-container font-label-lg text-label-lg transition-all">Grains</button>
<button class="px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant font-label-lg text-label-lg hover:border-primary transition-all">Dairy</button>
<button class="px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant font-label-lg text-label-lg hover:border-primary transition-all">Spices</button>
<button class="px-4 py-2 rounded-full border border-outline-variant text-on-surface-variant font-label-lg text-label-lg hover:border-primary transition-all">Beverages</button>
</div>
</section>
<!-- Pricing & Units -->
<section class="p-md bg-surface-container-low rounded-xl border border-outline-variant space-y-md">
<h3 class="font-title-md text-title-md text-on-surface">Pricing &amp; Unit</h3>
<div class="grid grid-cols-2 gap-md">
<div class="relative">
<label class="absolute -top-2 left-3 px-1 bg-surface-container-low text-label-md font-label-md text-primary z-10">Base Price (₹)</label>
<input class="w-full h-14 px-4 rounded-lg border border-outline focus:border-2 focus:border-primary focus:ring-0 bg-transparent text-body-lg font-body-lg font-bold outline-none" type="number" value="0.00">
</div>
<div class="relative">
<label class="absolute -top-2 left-3 px-1 bg-surface-container-low text-label-md font-label-md text-outline z-10">Unit</label>
<select class="w-full h-14 px-4 rounded-lg border border-outline-variant focus:border-2 focus:border-primary focus:ring-0 bg-transparent text-body-lg font-body-lg outline-none appearance-none">
<option>Pcs</option>
<option>Kg</option>
<option>Ltr</option>
<option>Box</option>
<option>Doz</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">expand_more</span>
</div>
</div>
</section>
<!-- GST Settings -->
<section class="space-y-md">
<h3 class="font-title-md text-title-md text-on-surface">GST Settings</h3>
<div class="space-y-sm">
<p class="font-label-md text-label-md text-on-surface-variant">Select GST Rate (%)</p>
<div class="grid grid-cols-4 gap-2">
<button class="h-10 rounded-lg border border-outline-variant text-on-surface-variant font-label-lg text-label-lg hover:bg-surface-container-high transition-colors">5%</button>
<button class="h-10 rounded-lg border border-outline-variant text-on-surface-variant font-label-lg text-label-lg hover:bg-surface-container-high transition-colors">12%</button>
<button class="h-10 rounded-lg border-2 border-primary bg-primary-container text-on-primary-container font-label-lg text-label-lg">18%</button>
<button class="h-10 rounded-lg border border-outline-variant text-on-surface-variant font-label-lg text-label-lg hover:bg-surface-container-high transition-colors">28%</button>
</div>
</div>
<div class="flex items-center justify-between p-md bg-surface-container-highest/30 rounded-xl">
<div class="flex flex-col">
<span class="font-body-md text-body-md text-on-surface font-medium">Price inclusive of tax</span>
<span class="font-label-md text-label-md text-outline">GST will be calculated inside the base price</span>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox" value="">
<div class="w-11 h-6 bg-outline-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
</section>
<!-- Inventory Management -->
<section class="space-y-md">
<div class="flex items-center gap-2">
<h3 class="font-title-md text-title-md text-on-surface">Inventory Management</h3>
<span class="material-symbols-outlined text-outline text-lg">info</span>
</div>
<div class="grid grid-cols-2 gap-md">
<div class="relative">
<label class="absolute -top-2 left-3 px-1 bg-surface text-label-md font-label-md text-outline z-10">Opening Stock</label>
<input class="w-full h-14 px-4 rounded-lg border border-outline-variant focus:border-2 focus:border-primary focus:ring-0 bg-transparent text-body-lg font-body-lg outline-none" placeholder="0" type="number">
</div>
<div class="relative">
<label class="absolute -top-2 left-3 px-1 bg-surface text-label-md font-label-md text-outline z-10">Low Stock Alert</label>
<input class="w-full h-14 px-4 rounded-lg border border-outline-variant focus:border-2 focus:border-primary focus:ring-0 bg-transparent text-body-lg font-body-lg outline-none" placeholder="5" type="number">
</div>
</div>
</section>
<!-- Additional Options -->
<button class="w-full flex items-center justify-between py-md border-t border-outline-variant group">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-outline group-hover:text-primary">description</span>
<span class="font-body-lg text-body-lg text-on-surface">Add Description &amp; Notes</span>
</div>
<span class="material-symbols-outlined text-outline">chevron_right</span>
</button>
</main>
<!-- Fixed Bottom Action Bar -->
<footer class="fixed bottom-0 left-0 w-full z-50 bg-surface shadow-[0_-4px_10px_rgba(0,0,0,0.05)] px-margin-mobile pt-3 pb-6 flex gap-3">
<button class="flex-1 h-12 rounded-full border border-outline-variant text-primary font-title-md text-title-md hover:bg-surface-container-low active:scale-95 transition-all">
            Cancel
        </button>
<button class="flex-[2] h-12 rounded-full bg-primary text-on-primary font-title-md text-title-md shadow-lg shadow-primary/20 active:scale-95 transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-lg fill-icon">save</span>
            Save Product
        </button>
</footer>
<!-- Micro-interactions Script -->
<script>
        document.querySelectorAll('input, select').forEach(el => {
            el.addEventListener('focus', () => {
                const label = el.previousElementSibling;
                if(label && label.tagName === 'LABEL') {
                    label.classList.add('text-primary');
                    label.classList.remove('text-outline');
                }
            });
            el.addEventListener('blur', () => {
                const label = el.previousElementSibling;
                if(label && label.tagName === 'LABEL') {
                    label.classList.remove('text-primary');
                    label.classList.add('text-outline');
                }
            });
        });

        // Toggle Chip Selection Logic
        const gstChips = document.querySelectorAll('.grid-cols-4 button');
        gstChips.forEach(chip => {
            chip.addEventListener('click', () => {
                gstChips.forEach(c => {
                    c.classList.remove('border-2', 'border-primary', 'bg-primary-container', 'text-on-primary-container');
                    c.classList.add('border', 'border-outline-variant', 'text-on-surface-variant');
                });
                chip.classList.add('border-2', 'border-primary', 'bg-primary-container', 'text-on-primary-container');
                chip.classList.remove('border', 'border-outline-variant', 'text-on-surface-variant');
            });
        });
    </script>


</body></html>
