<script>
        // Micro-interaction for search focus
        const searchInput = document.querySelector('input[type="text"]');
        searchInput.addEventListener('focus', () => {
            searchInput.parentElement.classList.add('scale-[1.01]');
            searchInput.parentElement.classList.add('transition-transform');
        });
        searchInput.addEventListener('blur', () => {
            searchInput.parentElement.classList.remove('scale-[1.01]');
        });

        // Filter button toggle logic (Simplified)
        const filterButtons = document.querySelectorAll('.flex.gap-sm button');
        filterButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                filterButtons.forEach(b => {
                    b.classList.remove('bg-primary', 'text-on-primary', 'shadow-md');
                    b.classList.add('glass-card', 'text-on-surface-variant');
                });
                btn.classList.add('bg-primary', 'text-on-primary', 'shadow-md');
                btn.classList.remove('glass-card', 'text-on-surface-variant');
            });
        });
    </script>
