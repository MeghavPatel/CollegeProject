<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-x-hidden">

<div class="w-full max-w-[440px]">
<!-- Login Card -->
<div class="glass-panel rounded-xl shadow-2xl p-lg md:p-xl animate-in fade-in slide-in-from-bottom-4 duration-700">

<h1 class="font-headline-xl text-headline-xl text-on-surface mb-2">Welcome back</h1>
<p class="font-body-md text-on-surface-variant">Please enter your details to access your warehouse.</p>
</div>
<form class="space-y-md" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="space-y-1">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="email">Email Address</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full pl-10 pr-md py-3 bg-white border border-outline-variant/50 rounded-lg text-on-surface font-body-md placeholder:text-outline transition-all focus:border-primary" id="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-1">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="password">Password</label>
<a class="text-sm font-semibold text-primary hover:text-primary-container transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full pl-10 pr-12 py-3 bg-white border border-outline-variant/50 rounded-lg text-on-surface font-body-md placeholder:text-outline transition-all focus:border-primary" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-2 py-1">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary/20" id="remember" type="checkbox"/>
<label class="font-body-sm text-on-surface-variant cursor-pointer select-none" for="remember">Stay signed in for 30 days</label>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container text-on-primary-container py-3 rounded-lg font-semibold text-body-lg shadow-lg shadow-primary/10 hover:shadow-primary/20 hover:scale-[1.01] active:scale-95 transition-all duration-200" type="submit">
                        Sign In

</form>
<!-- Divider -->
<div class="relative my-lg">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/30"></div>

<script>
        // Micro-interaction for input fields
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('ring-2', 'ring-primary/10');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('ring-2', 'ring-primary/10');
            });
        });

        // Simple visibility toggle logic
        const toggleBtn = document.querySelector('button span[text="visibility"]');
        if(toggleBtn) {
            toggleBtn.parentElement.addEventListener('click', () => {
                const input = document.getElementById('password');
                if (input.type === 'password') {
                    input.type = 'text';
                    toggleBtn.innerText = 'visibility_off';
                } else {
                    input.type = 'password';
                    toggleBtn.innerText = 'visibility';
                }
            });
        }
    </script>
